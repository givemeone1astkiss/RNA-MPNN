[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnampnn"
version = "1.0.0"
description = "A graph neural network-based RNA refolding algorithm to recover RNA sequences from structural information"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "RNA-MPNN Team", email = "rnampnn@example.com"}
]
maintainers = [
    {name = "RNA-MPNN Team", email = "rnampnn@example.com"}
]
keywords = [
    "RNA",
    "neural networks",
    "graph neural networks",
    "message passing",
    "sequence prediction",
    "structural biology",
    "bioinformatics",
    "deep learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.26.4",
    "torch>=2.0.0",
    "biopython>=1.78",
    "pytorch-lightning>=2.5.1",
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
    "xgboost>=2.1.1",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.0.0",
    "scipy>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
    "sphinx-autodoc-typehints>=1.19.0",
]
gpu = [
    "torch[cuda]>=2.0.0",
]
all = [
    "rnampnn[dev,docs,gpu]",
]

[project.urls]
Homepage = "https://github.com/RNA-MPNN/RNA-MPNN"
Documentation = "https://rnampnn.readthedocs.io"
Repository = "https://github.com/RNA-MPNN/RNA-MPNN.git"
Issues = "https://github.com/RNA-MPNN/RNA-MPNN/issues"
Changelog = "https://github.com/RNA-MPNN/RNA-MPNN/blob/main/CHANGELOG.md"

[project.scripts]
rnampnn = "rnampnn.cli:main"
rnampnn-train = "rnampnn.cli:train"
rnampnn-predict = "rnampnn.cli:predict"

[tool.setuptools.packages.find]
where = ["."]
include = ["rnampnn*", "rdesign*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
rnampnn = ["config/*.yaml", "config/*.json", "assets/*"]
rdesign = ["config/*.yaml", "config/*.json", "assets/*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["rnampnn", "rdesign"]
known_third_party = ["torch", "numpy", "pandas", "matplotlib", "seaborn"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "pytorch_lightning.*",
    "xgboost.*",
    "biopython.*",
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["rnampnn", "rdesign"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py38"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.ruff.isort]
known-first-party = ["rnampnn", "rdesign"]

# Documentation configuration
[tool.sphinx]
source-dir = "docs"
build-dir = "docs/_build"
all_files = true

# Jupyter notebook configuration
[tool.jupyter]
notebook_dir = "examples"
